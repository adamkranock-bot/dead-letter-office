<div class="dlo-message-row dlo-link">
	<div class="dlo-message-row-control">
		<div class="dlo-checkbox">
			<input class="styled-checkbox" id="{checkboxid}" type="checkbox">
			<label for="{checkboxid}"></label>
		</div>
		<div class="icon dlo-last-author"></div>
		<div class="icon dlo-save-toggle"></div>
	</div>
	<div class="dlo-mrc-wrapper">
		<div class="dlo-message-row-content">
			<div class="dlo-subject-line">
				<div class="dlo-subject-left">
				    <span class="dlo-correspondent"></span>
				    <span class="dlo-seperator">&bull; </span>
				    <span class="dlo-subject"></span>
				</div>
				<div class="dlo-subject-right">
					<div class="dlo-datetime"></div>
					<div class="dlo-message-buttons">
						<button class="icon icon-archive"></button>
						<button class="icon icon-restore"></button>
						<button class="icon icon-markRead"></button>
						<button class="icon icon-markUnread"></button>
					</div>
				</div>
			</div>
			<div class="dlo-subject-text">
				<div class="dlo-text"></div>
			</div>
		</div>
	</div>
</div>
