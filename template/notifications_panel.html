<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>YAIR</title>
	<link rel="stylesheet" href="../css/notifications.css" type="text/css" />
	<script src="../js/global/time.js"></script>
	<script src="../js/notifications/fetch.js" defer></script>
</head>

<body class="popup">
	<header id="control">
		<div class="brand">
			<span class="wordmark">YAIR</span>
			<span class="status" id="unreadStatus">Unread messages</span>
		</div>
		<button class="forceRefresh icon-button" title="Check for new messages" aria-label="Check for new messages"></button>
		<button class="open-inbox" id="openInbox" type="button">Open inbox</button>
	</header>
	<div id="notifications">
		<div class="no-notifications">
			<h4>No unread messages</h4>
		</div>
	</div>
</body>

</html>
