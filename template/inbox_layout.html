<div class="yair-body">
	<div class="yair-sidebar-panel">
			<div class="yair-sidebar-menu">	
				<div class="yair-sidebar-title">
					<div class="title-message"><a href="/message/yair_inbox">YAIR</a><span class="yair-tagline">Reddit message archive</span></div>
					<div class="new-message">
						<a href="/message/compose" class="icon msg-icon" title="New message" aria-label="New message"></a>
					</div>
				</div>
				<div class="yair-sidebar-nav inbox">
					<a href="/message/yair_inbox" class="nav-item yair-inbox yair-link">
						<div class="icon icon-inbox"></div>
						<div class="title">Inbox</div>
					</a>
					<a href="/message/yair_drafts" class="nav-item yair-drafts yair-link">
						<div class="icon icon-drafts"></div>
						<div class="title">Drafts</div>
					</a>
					<a href="/message/yair_saved" class="nav-item yair-saved yair-link">
						<div class="icon icon-saved"></div>
						<div class="title">Saved</div>
					</a>
					<a href="/message/yair_archived" class="nav-item yair-archived yair-link">
						<div class="icon icon-archive"></div>
						<div class="title">Archived</div>
					</a>
				</div>
				<div class="yair-sidebar-nav modmail yair-modmail yair-hide">
					<h4 class="yair-sidebar-label">Modmail</h4>
					<a href="/message/yair_modmail" class="nav-item modmail-inbox yair-link">
						<div class="icon icon-modmail"></div>
						<div class="title">Inbox</div>
					</a>
					<a href="/message/yair_moddrafts" class="nav-item modmail yair-drafts yair-link">
						<div class="icon icon-drafts"></div>
						<div class="title">Drafts</div>
					</a>
					<a href="/message/yair_modsaved" class="nav-item modmail yair-saved yair-link">
						<div class="icon icon-saved"></div>
						<div class="title">Saved</div>
					</a>
					<a href="/message/yair_modarchived" class="nav-item modmail yair-archived yair-link">
						<div class="icon icon-archive"></div>
						<div class="title">Archived</div>
					</a>
				</div>


				<div class="yair-sidebar-options yair-hide">
					<h4 class="yair-sidebar-label">With selected</h4>
					<div id="YAIRBulkDelete" class="options-item">
						<div class="icon icon-archive"></div>
						Archive
					</div>

					<div id="YAIRBulkRestore" class="options-item">
						<div class="icon icon-restore"></div>
						Restore
					</div>

					<div id="YAIRBulkMarkUnread" class="options-item">
						<div class="icon icon-markRead"></div>
						Mark Selected Unread
					</div>

					<div id="YAIRBulkMarkRead" class="options-item">
						<div class="icon icon-markUnread"></div>
						Mark Selected Read
					</div>
				</div>
			</div>
			<div class="yair-sidebar-footer">
				<div id="YAIRShowConfig">
					<div class="icon icon-config"></div>
					Settings
				</div>
			</div>
	</div>
	<div class="yair-main-panel">
		<div class="yair-header-panel">
			<div class="yair-search-panel">
				<div class="yair-search-container">
					<!-- Input and search button -->
					<input type="text" id="YAIRSearchInput" placeholder="Search (from:user, subject:words, message:words)" aria-label="Search conversations"><button id="YAIRSearchClear" class="yair-search-clear yair-hide" type="button" title="Clear search" aria-label="Clear search">&times;</button></div>
				<button id="YAIRSearchButton">Search</button>
			</div>
			<div class="yair-select-all-toggle">
				<input class="styled-checkbox" id="select-all" type="checkbox">
				<label for="select-all">Select All</label>
			</div>
		</div>
		<div class="yair-list-toolbar" role="toolbar" aria-label="Sort and filter conversations">
			<label class="yair-tool">
				<span class="yair-tool-label">Sort</span>
				<select id="YAIRSort">
					<option value="newest">Latest activity</option>
					<option value="oldest">Oldest activity</option>
					<option value="started">Recently started</option>
					<option value="most">Most messages</option>
					<option value="fewest">Fewest messages</option>
					<option value="az">Name, A to Z</option>
				</select>
			</label>
			<div class="yair-tool yair-length-tool" role="group" aria-label="Messages in the conversation">
				<span class="yair-tool-label">Messages</span>
				<span class="yair-length-presets">
					<button type="button" class="yair-length-preset">Any</button>
					<button type="button" class="yair-length-preset" data-min="1" data-max="1">1</button>
					<button type="button" class="yair-length-preset" data-min="2">2+</button>
					<button type="button" class="yair-length-preset" data-min="5">5+</button>
					<button type="button" class="yair-length-preset" data-min="10">10+</button>
					<button type="button" class="yair-length-preset" data-min="25">25+</button>
				</span>
				<span class="yair-length-range">
					<input id="YAIRMinMessages" type="number" min="1" inputmode="numeric" placeholder="min" aria-label="At least this many messages">
					<span aria-hidden="true">to</span>
					<input id="YAIRMaxMessages" type="number" min="1" inputmode="numeric" placeholder="max" aria-label="At most this many messages">
				</span>
			</div>
			<label class="yair-tool">
				<span class="yair-tool-label">Year</span>
				<select id="YAIRYear">
					<option value="">All</option>
				</select>
			</label>
			<label class="yair-tool">
				<span class="yair-tool-label">Last message</span>
				<select id="YAIRLastFrom">
					<option value="">From anyone</option>
					<option value="them">From them</option>
					<option value="me">From me</option>
				</select>
			</label>
		</div>
		<div class="yair-inbox-panel">
			<!-- Checkbox, Correspondent, Title, Text, Date/Time -->
		</div>
		<div style="height:8px"></div>
	</div>
</div>
