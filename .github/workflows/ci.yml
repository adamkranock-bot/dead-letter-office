name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Validate for Firefox (web-ext lint)
        # Warnings about Chrome-only keys (service_worker, offscreen) are expected
        run: npm run lint:firefox || true
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test against a mock Reddit
        run: npm run test:e2e
      - name: Build zip
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: yair-extension
          path: dist/*.zip
