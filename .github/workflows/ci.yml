name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build every browser package
        run: npm run build
      - name: Validate the Firefox package (web-ext lint)
        run: npx web-ext lint --source-dir dist/firefox
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (built Chrome package) against a mock Reddit
        run: npm run test:e2e
        env:
          DLO_EXT: dist/chrome
      - uses: actions/upload-artifact@v4
        with:
          name: dead-letter-office-packages
          path: dist/*.zip
